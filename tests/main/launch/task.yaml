summary: Launch workshop with skills-sdk SDK

prepare: |
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch

restore: |
  workshop remove || true

execute: |
  # Verify the skills CLI is available in the workshop
  workshop exec -- which skills

  # The packaged CLI must be the version pinned in VERSION
  VERSION_REGEX="$(echo "${EXPECTED_VERSION}" | sed 's/\./\\./g')"
  workshop exec -- skills --version | MATCH "^${VERSION_REGEX}$"

debug: |
  workshop tasks
